<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carril9 | Transmisión en vivo</title>
  <meta name="description" content="Acceso directo a la transmisión en vivo de Carril9." />

  <style>
    :root {
      --bg-1: #061525;
      --bg-2: #082b4c;
      --card: rgba(255, 255, 255, 0.10);
      --card-border: rgba(255, 255, 255, 0.18);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.78);
      --accent: #1fb6ff;
      --accent-2: #00e0ff;
      --live: #ff2d55;
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(31, 182, 255, 0.28), transparent 35%),
        linear-gradient(160deg, var(--bg-1), var(--bg-2));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .page {
      width: 100%;
      max-width: 460px;
    }

    .hero {
      text-align: center;
      padding: 26px 18px 20px;
    }

    /* 🔵 BLOQUE LOGO + TEXTO */
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .logo-img {
      width: 60px; /* 🔥 ajuste clave */
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.35));
    }

    .brand-text {
      text-align: left;
      line-height: 1;
    }

    .brand-name {
      font-size: 1.9rem;
      font-weight: 900;
      letter-spacing: -0.04em;
    }

    .brand-subtitle {
      margin-top: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent-2);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      box-shadow: 0 24px 60px var(--shadow);
      backdrop-filter: blur(18px);
      overflow: hidden;
    }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 13px;
      border-radius: 999px;
      background: rgba(255, 45, 85, 0.16);
      border: 1px solid rgba(255, 45, 85, 0.45);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--live);
      box-shadow: 0 0 0 6px rgba(255, 45, 85, 0.18);
      animation: pulse 1.35s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.78); opacity: 0.68; }
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 2.6rem);
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .intro {
      margin: 14px auto 0;
      max-width: 330px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .actions {
      padding: 4px 18px 22px;
    }

    .main-button {
      width: 100%;
      min-height: 60px;
      border-radius: 19px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #04111f;
      background: linear-gradient(135deg, #ffffff, var(--accent-2));
      font-weight: 900;
      box-shadow: 0 18px 35px rgba(0, 224, 255, 0.20);
    }

    .secondary-button {
      margin-top: 12px;
      width: 100%;
      min-height: 50px;
      border-radius: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    footer {
      margin-top: 14px;
      text-align: center;
      color: rgba(255, 255, 255, 0.54);
      font-size: 0.76rem;
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card">

      <div class="hero">

        <!-- 🔵 LOGO -->
        <div class="brand">
          <img src="logo_carril9.png" alt="Logo Carril9" class="logo-img">
          <div class="brand-text">
            <div class="brand-name">Carril9</div>
            <div class="brand-subtitle">Natación en vivo</div>
          </div>
        </div>

        <!-- 🔴 LIVE -->
        <div class="live-pill">
          <span class="dot"></span>
          En vivo
        </div>

        <!-- 🎯 TITULO -->
        <h1>Mirá el torneo en vivo</h1>

        <p class="intro">
          Accedé directo a la transmisión oficial desde tu celular.
        </p>

      </div>

      <div class="actions">

        <a class="main-button"
           href="https://youtube.com/live/XKh5ITd38gc?feature=share"
           target="_blank">
          Ver transmisión en vivo
        </a>

        <a class="secondary-button"
           href="https://www.youtube.com/@Carril9Transmisiones"
           target="_blank">
          Ir al canal de YouTube
        </a>

      </div>

    </section>

    <footer>
      Producción y transmisión · Carril9
    </footer>

  </main>
</body>
</html>

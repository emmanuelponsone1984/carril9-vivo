<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carril9 | Natación en vivo</title>
  <meta name="description" content="Carril9 - Transmisiones en vivo, resultados y cobertura de torneos de natación." />

  <style>
    :root {
      --bg: #06111f;
      --bg-2: #0a1f38;
      --card: rgba(255, 255, 255, 0.08);
      --card-strong: rgba(255, 255, 255, 0.13);
      --line: rgba(255, 255, 255, 0.16);
      --text: #f4f8ff;
      --muted: #b7c7da;
      --blue: #00a6ff;
      --cyan: #34e7ff;
      --orange: #ffb02e;
      --danger: #ff3b3b;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      --radius: 28px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 12%, rgba(0, 166, 255, 0.28), transparent 34%),
        radial-gradient(circle at 80% 4%, rgba(52, 231, 255, 0.18), transparent 32%),
        linear-gradient(145deg, var(--bg), var(--bg-2) 58%, #020711);
      overflow-x: hidden;
    }

    .page { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 26px 0;
    }

    .brand { display: flex; align-items: center; gap: 14px; }

    .brand img {
      width: 58px;
      height: 58px;
      object-fit: contain;
    }

    .brand-title strong { font-size: 1.35rem; }
    .brand-title span { color: var(--muted); font-size: 0.86rem; }

    .hero {
      min-height: calc(100vh - 120px);
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      align-items: center;
      gap: 48px;
    }

    .lead {
      margin-top: 20px;
      color: var(--muted);
      max-width: 600px;
    }

    .actions { margin-top: 30px; }

    .btn {
      display: inline-block;
      padding: 14px 22px;
      border-radius: 999px;
      font-weight: 900;
      text-decoration: none;
      margin-right: 10px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      color: #03101d;
    }

    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: white;
    }

    footer {
      margin-top: 60px;
      text-align: center;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <div class="page">

    <header>
      <div class="brand">
        <img src="logos/logo_carril9.png" alt="Logo Carril9">
        <div class="brand-title">
          <strong>Carril9</strong>
          <span>Natación en vivo</span>
        </div>
      </div>
    </header>

    <main>
      <section class="hero">

        <div>
          <h1>Torneos de natación en vivo</h1>

          <p class="lead">
            Carril9 transmite competencias con estética profesional, resultados claros
            y una experiencia pensada para clubes, nadadores y familias.
          </p>

          <div class="actions">
            <a class="btn btn-primary" href="vivo.html">Ver transmisión</a>
            <a class="btn btn-secondary" href="https://www.youtube.com/@Carril9Transmisiones" target="_blank">
              Ir al canal
            </a>
          </div>
        </div>

      </section>
    </main>

    <footer>
      Carril9 · Bariloche
    </footer>

  </div>
</body>
</html>
